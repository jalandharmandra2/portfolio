<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="nidsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#nidsBg)"/>
  
  <!-- Cyber Grid -->
  <g opacity="0.15" stroke="#38bdf8" stroke-width="0.8">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
  </g>

  <!-- Header Banner of Dashboard -->
  <rect x="30" y="30" width="740" height="60" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2"/>
  <circle cx="60" cy="60" r="14" fill="#0284c7" opacity="0.2"/>
  <path d="M 54 60 L 60 54 L 66 60 L 60 66 Z" fill="#38bdf8"/>
  <text x="85" y="58" fill="#f8fafc" font-family="'Segoe UI', Roboto, sans-serif" font-weight="bold" font-size="16">Network Intrusion Detection System (NIDS)</text>
  <text x="85" y="74" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="11">Deep Learning LSTM Classifier • CICIDS2017 Benchmark • Streamlit UI</text>

  <!-- Live Status Badge -->
  <rect x="630" y="47" width="120" height="26" rx="13" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
  <circle cx="646" cy="60" r="4" fill="#34d399" filter="url(#softGlow)"/>
  <text x="658" y="64" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="bold">ACTIVE INFERENCE</text>

  <!-- Left Card: LSTM Architecture Visual -->
  <rect x="30" y="110" width="355" height="240" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
  <text x="50" y="140" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="bold">DEEP LEARNING MODEL ARCHITECTURE</text>
  
  <!-- Neural Network Diagram -->
  <g transform="translate(60, 160)">
    <!-- Layer 1: Inputs -->
    <text x="0" y="-8" fill="#94a3b8" font-family="monospace" font-size="10">Features (78)</text>
    <circle cx="30" cy="15" r="7" fill="#64748b"/>
    <circle cx="30" cy="45" r="7" fill="#64748b"/>
    <circle cx="30" cy="75" r="7" fill="#64748b"/>
    <circle cx="30" cy="105" r="7" fill="#64748b"/>
    
    <!-- Connections -->
    <path d="M 37 15 L 120 40 M 37 45 L 120 40 M 37 75 L 120 80 M 37 105 L 120 80" stroke="#38bdf8" stroke-width="1" opacity="0.4"/>
    <path d="M 37 45 L 120 80 M 37 75 L 120 40" stroke="#38bdf8" stroke-width="1" opacity="0.3"/>

    <!-- Layer 2: LSTM Cells -->
    <text x="105" y="-8" fill="#38bdf8" font-family="monospace" font-size="10">LSTM Layer</text>
    <rect x="120" y="25" width="45" height="30" rx="4" fill="#0284c7" stroke="#38bdf8" stroke-width="1"/>
    <text x="126" y="44" fill="#ffffff" font-family="monospace" font-size="9" font-weight="bold">LSTM</text>
    <rect x="120" y="65" width="45" height="30" rx="4" fill="#0284c7" stroke="#38bdf8" stroke-width="1"/>
    <text x="126" y="84" fill="#ffffff" font-family="monospace" font-size="9" font-weight="bold">LSTM</text>

    <!-- Connections to Dense -->
    <path d="M 165 40 L 225 60 M 165 80 L 225 60" stroke="#38bdf8" stroke-width="1" opacity="0.6"/>

    <!-- Layer 3: Output Classification -->
    <text x="210" y="-8" fill="#10b981" font-family="monospace" font-size="10">Classification</text>
    <circle cx="230" cy="40" r="9" fill="#10b981" filter="url(#softGlow)"/>
    <text x="245" y="44" fill="#34d399" font-family="monospace" font-size="10">Benign</text>
    <circle cx="230" cy="80" r="9" fill="#ef4444" filter="url(#softGlow)"/>
    <text x="245" y="84" fill="#f87171" font-family="monospace" font-size="10">Intrusion</text>
  </g>

  <!-- Right Card: Streamlit Threat Telemetry & Chart -->
  <rect x="415" y="110" width="355" height="240" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
  <text x="435" y="140" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="bold">STREAMLIT THREAT MONITORING</text>

  <!-- Threat Graph Wave -->
  <g transform="translate(435, 160)">
    <!-- Chart Box -->
    <rect width="315" height="150" rx="6" fill="#030712" stroke="#1e293b"/>
    <!-- Grid inside chart -->
    <line x1="0" y1="40" x2="315" y2="40" stroke="#1e293b" stroke-dasharray="2 2"/>
    <line x1="0" y1="80" x2="315" y2="80" stroke="#1e293b" stroke-dasharray="2 2"/>
    <line x1="0" y1="120" x2="315" y2="120" stroke="#1e293b" stroke-dasharray="2 2"/>
    
    <!-- Wave line -->
    <path d="M 0 120 Q 30 110, 60 115 T 120 100 T 170 30 T 210 110 T 270 95 T 315 105" fill="none" stroke="url(#cyanLine)" stroke-width="2.5"/>
    <path d="M 0 120 Q 30 110, 60 115 T 120 100 T 170 30 T 210 110 T 270 95 T 315 105 L 315 150 L 0 150 Z" fill="#0284c7" opacity="0.12"/>
    
    <!-- Anomaly Point Detected -->
    <circle cx="170" cy="30" r="5" fill="#ef4444" filter="url(#softGlow)"/>
    <rect x="135" y="8" width="85" height="18" rx="4" fill="#991b1b"/>
    <text x="142" y="20" fill="#fee2e2" font-family="monospace" font-size="9" font-weight="bold">DDoS Attack !</text>
  </g>

  <!-- Bottom Metric Strip -->
  <rect x="30" y="370" width="740" height="95" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
  
  <g transform="translate(60, 395)">
    <text x="0" y="15" fill="#94a3b8" font-family="sans-serif" font-size="11">MODEL ACCURACY</text>
    <text x="0" y="42" fill="#38bdf8" font-family="sans-serif" font-size="22" font-weight="bold">98.7%</text>
  </g>
  <line x1="220" y1="385" x2="220" y2="450" stroke="#334155"/>

  <g transform="translate(250, 395)">
    <text x="0" y="15" fill="#94a3b8" font-family="sans-serif" font-size="11">DATASET PROCESSED</text>
    <text x="0" y="42" fill="#f8fafc" font-family="sans-serif" font-size="20" font-weight="bold">CICIDS2017</text>
  </g>
  <line x1="430" y1="385" x2="430" y2="450" stroke="#334155"/>

  <g transform="translate(460, 395)">
    <text x="0" y="15" fill="#94a3b8" font-family="sans-serif" font-size="11">INFERENCE LATENCY</text>
    <text x="0" y="42" fill="#34d399" font-family="sans-serif" font-size="22" font-weight="bold">&lt; 14 ms</text>
  </g>
  <line x1="620" y1="385" x2="620" y2="450" stroke="#334155"/>

  <g transform="translate(640, 395)">
    <text x="0" y="15" fill="#94a3b8" font-family="sans-serif" font-size="11">FRAMEWORK</text>
    <text x="0" y="42" fill="#fbbf24" font-family="sans-serif" font-size="18" font-weight="bold">Python / ML</text>
  </g>
</svg>