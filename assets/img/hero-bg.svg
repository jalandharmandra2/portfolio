<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="darkSpace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="40%" stop-color="#071224"/>
      <stop offset="80%" stop-color="#0a192f"/>
      <stop offset="100%" stop-color="#020813"/>
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="cyanGlow" cx="75%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#149ddd" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="indigoGlow" cx="25%" cy="75%" r="50%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#1e1b4b" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0"/>
    </radialGradient>

    <!-- Tech Grid Pattern -->
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.4"/>
      <circle cx="60" cy="60" r="1.5" fill="#149ddd" opacity="0.3"/>
    </pattern>

    <!-- Filter for soft neon glow -->
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Dark Canvas -->
  <rect width="1920" height="1080" fill="url(#darkSpace)"/>
  <rect width="1920" height="1080" fill="url(#cyanGlow)"/>
  <rect width="1920" height="1080" fill="url(#indigoGlow)"/>

  <!-- Geometric Grid Layer -->
  <rect width="1920" height="1080" fill="url(#grid)"/>

  <!-- Abstract Neural / Network Intrusion Nodes & Connections (Representing Python & ML) -->
  <g opacity="0.45" stroke="#149ddd" stroke-width="1.2">
    <!-- Links -->
    <line x1="1250" y1="220" x2="1420" y2="180" stroke-dasharray="4 4"/>
    <line x1="1420" y1="180" x2="1580" y2="280"/>
    <line x1="1580" y1="280" x2="1750" y2="210"/>
    <line x1="1420" y1="180" x2="1480" y2="380"/>
    <line x1="1480" y1="380" x2="1640" y2="440" stroke-dasharray="6 3"/>
    <line x1="1640" y1="440" x2="1790" y2="390"/>
    <line x1="1580" y1="280" x2="1640" y2="440"/>
    <line x1="1350" y1="520" x2="1480" y2="380"/>
    <line x1="1480" y1="380" x2="1530" y2="600"/>
    <line x1="1640" y1="440" x2="1720" y2="620"/>

    <!-- Nodes -->
    <circle cx="1250" cy="220" r="4" fill="#38bdf8"/>
    <circle cx="1420" cy="180" r="6" fill="#149ddd" filter="url(#neon)"/>
    <circle cx="1580" cy="280" r="5" fill="#0ea5e9"/>
    <circle cx="1750" cy="210" r="4" fill="#38bdf8"/>
    <circle cx="1480" cy="380" r="7" fill="#60a5fa" filter="url(#neon)"/>
    <circle cx="1640" cy="440" r="5" fill="#38bdf8"/>
    <circle cx="1790" cy="390" r="4" fill="#149ddd"/>
    <circle cx="1350" cy="520" r="4.5" fill="#0ea5e9"/>
    <circle cx="1530" cy="600" r="5" fill="#38bdf8"/>
    <circle cx="1720" cy="620" r="4" fill="#149ddd"/>
  </g>

  <!-- Left Side Data Flow & Binary Matrix Stream (Subtle) -->
  <g opacity="0.12" fill="#38bdf8" font-family="'Courier New', monospace" font-size="14">
    <text x="120" y="240">01001010 01000001 01001100 01000001</text>
    <text x="120" y="270">01001110 01000100 01001000 01000001</text>
    <text x="120" y="300">01010010 00100000 01001101 01000001</text>
    <text x="120" y="450">POST /api/v1/auth/login HTTP/1.1 200 OK</text>
    <text x="120" y="480">GET  /api/v1/jobs/?status=active 200 OK</text>
    <text x="120" y="510">POST /api/v1/detect-intrusion/ 201 Created</text>
  </g>

  <!-- Right Side Floating IDE Code Windows Mockup -->
  <g transform="translate(1120, 480)" opacity="0.85">
    <!-- Code Editor Card -->
    <rect width="680" height="420" rx="12" fill="#0d1527" stroke="#1e293b" stroke-width="1.5" filter="url(#neon)"/>
    <!-- Window Header -->
    <rect width="680" height="38" rx="12" fill="#111c33"/>
    <circle cx="20" cy="19" r="5.5" fill="#ef4444"/>
    <circle cx="38" cy="19" r="5.5" fill="#f59e0b"/>
    <circle cx="56" cy="19" r="5.5" fill="#10b981"/>
    <text x="80" y="24" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="12">models.py — Django &amp; Deep Learning Pipeline</text>

    <!-- Code Syntax Content -->
    <g font-family="'Fira Code', 'Courier New', monospace" font-size="13" transform="translate(25, 65)">
      <!-- Line 1 -->
      <text y="0" fill="#ec4899">import</text>
      <text x="60" y="0" fill="#f8fafc">torch.nn</text>
      <text x="135" y="0" fill="#ec4899">as</text>
      <text x="160" y="0" fill="#f8fafc">nn</text>
      
      <!-- Line 2 -->
      <text y="24" fill="#ec4899">from</text>
      <text x="45" y="24" fill="#f8fafc">django.db</text>
      <text x="135" y="24" fill="#ec4899">import</text>
      <text x="195" y="24" fill="#f8fafc">models</text>

      <!-- Line 3 -->
      <text y="48" fill="#ec4899">from</text>
      <text x="45" y="48" fill="#f8fafc">rest_framework</text>
      <text x="180" y="48" fill="#ec4899">import</text>
      <text x="240" y="48" fill="#f8fafc">viewsets, serializers</text>

      <!-- Line 4: Comment -->
      <text y="80" fill="#64748b" font-style="italic"># LSTM Network Intrusion Detection Architecture</text>

      <!-- Line 5 -->
      <text y="104" fill="#38bdf8">class</text>
      <text x="50" y="104" fill="#fbbf24">NetworkIntrusionClassifier</text>
      <text x="270" y="104" fill="#94a3b8">(nn.Module):</text>

      <!-- Line 6 -->
      <text x="20" y="128" fill="#38bdf8">def</text>
      <text x="55" y="128" fill="#60a5fa">__init__</text>
      <text x="125" y="128" fill="#94a3b8">(self, input_dim=78, hidden_dim=128):</text>

      <!-- Line 7 -->
      <text x="40" y="152" fill="#94a3b8">super().__init__()</text>

      <!-- Line 8 -->
      <text x="40" y="176" fill="#94a3b8">self.lstm = nn.LSTM(input_dim, hidden_dim, batch_first=</text>
      <text x="510" y="176" fill="#fbbf24">True</text>
      <text x="548" y="176" fill="#94a3b8">)</text>

      <!-- Line 9 -->
      <text x="40" y="200" fill="#94a3b8">self.classifier = nn.Sequential(nn.Linear(hidden_dim, 2), nn.Softmax())</text>

      <!-- Line 10: Comment -->
      <text y="235" fill="#64748b" font-style="italic"># Job Portal REST API ViewSet</text>

      <!-- Line 11 -->
      <text y="260" fill="#38bdf8">class</text>
      <text x="50" y="260" fill="#fbbf24">JobApplicationViewSet</text>
      <text x="240" y="260" fill="#94a3b8">(viewsets.ModelViewSet):</text>

      <!-- Line 12 -->
      <text x="20" y="284" fill="#94a3b8">queryset = JobApplication.objects.select_related(</text>
      <text x="460" y="284" fill="#34d399">'candidate'</text>
      <text x="545" y="284" fill="#94a3b8">)</text>
    </g>
  </g>

  <!-- Glowing Accent Lines at the bottom -->
  <line x1="0" y1="1078" x2="1920" y2="1078" stroke="#149ddd" stroke-width="2" opacity="0.7"/>
</svg>