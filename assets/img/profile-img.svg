<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="50%" stop-color="#112240"/>
      <stop offset="100%" stop-color="#1e3a5f"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#149ddd"/>
      <stop offset="100%" stop-color="#00d2ff"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2b997"/>
      <stop offset="100%" stop-color="#c9956d"/>
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a24"/>
      <stop offset="100%" stop-color="#0d0d12"/>
    </linearGradient>
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle -->
  <rect width="400" height="400" fill="url(#bgGrad)"/>
  
  <!-- Outer Tech Ring -->
  <circle cx="200" cy="200" r="188" fill="none" stroke="url(#accentGrad)" stroke-width="3" stroke-dasharray="10 6" opacity="0.6"/>
  <circle cx="200" cy="200" r="195" fill="none" stroke="#149ddd" stroke-width="1.5" opacity="0.3"/>

  <!-- Code/Tech Background Motifs -->
  <g opacity="0.15" fill="#149ddd" font-family="monospace" font-size="14">
    <text x="30" y="70">&lt;python/&gt;</text>
    <text x="300" y="90">{API}</text>
    <text x="25" y="320">def dev():</text>
    <text x="290" y="330">models.py</text>
  </g>

  <!-- Developer Silhouette / Illustration -->
  <g id="developer-character">
    <!-- Shoulders & Torso -->
    <path d="M 100 400 C 100 320, 140 290, 200 290 C 260 290, 300 320, 300 400 Z" fill="url(#shirtGrad)"/>
    
    <!-- Collar / Hoodie V-neck with Cyan Accent -->
    <path d="M 175 290 L 200 330 L 225 290 Z" fill="#0f172a" stroke="url(#accentGrad)" stroke-width="2"/>
    
    <!-- Neck -->
    <path d="M 180 250 L 220 250 L 220 295 L 180 295 Z" fill="url(#skinGrad)"/>
    <path d="M 180 268 C 195 285, 205 285, 220 268 L 220 295 L 180 295 Z" fill="#b8835d" opacity="0.4"/>

    <!-- Head / Face -->
    <ellipse cx="200" cy="205" rx="52" ry="62" fill="url(#skinGrad)"/>
    
    <!-- Ears -->
    <circle cx="147" cy="205" r="10" fill="url(#skinGrad)"/>
    <circle cx="253" cy="205" r="10" fill="url(#skinGrad)"/>

    <!-- Hair -->
    <!-- Modern stylish developer pompadour/fade haircut -->
    <path d="M 146 195 C 144 140, 165 125, 200 125 C 238 125, 256 140, 254 195 C 248 165, 235 155, 200 156 C 165 155, 152 165, 146 195 Z" fill="url(#hairGrad)"/>
    <path d="M 148 185 C 152 145, 175 130, 202 128 C 235 126, 255 142, 253 180 C 248 148, 220 145, 195 145 C 170 145, 155 160, 148 185 Z" fill="#242433"/>

    <!-- Eyebrows -->
    <path d="M 168 185 Q 183 180, 192 185" fill="none" stroke="#1a1a24" stroke-width="3" stroke-linecap="round"/>
    <path d="M 208 185 Q 217 180, 232 185" fill="none" stroke="#1a1a24" stroke-width="3" stroke-linecap="round"/>

    <!-- Tech Glasses -->
    <rect x="160" y="190" width="34" height="24" rx="6" fill="#149ddd" fill-opacity="0.1" stroke="#149ddd" stroke-width="2.5"/>
    <rect x="206" y="190" width="34" height="24" rx="6" fill="#149ddd" fill-opacity="0.1" stroke="#149ddd" stroke-width="2.5"/>
    <!-- Glasses Bridge -->
    <path d="M 194 200 L 206 200" fill="none" stroke="#149ddd" stroke-width="2.5"/>
    <!-- Glasses temples -->
    <path d="M 160 197 L 147 195" fill="none" stroke="#149ddd" stroke-width="2.5"/>
    <path d="M 240 197 L 253 195" fill="none" stroke="#149ddd" stroke-width="2.5"/>
    <!-- Lens reflection -->
    <line x1="166" y1="194" x2="176" y2="208" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <line x1="212" y1="194" x2="222" y2="208" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

    <!-- Eyes -->
    <circle cx="177" cy="202" r="3.5" fill="#1a1a24"/>
    <circle cx="223" cy="202" r="3.5" fill="#1a1a24"/>

    <!-- Nose -->
    <path d="M 197 207 L 200 220 L 205 220" fill="none" stroke="#b8835d" stroke-width="2" stroke-linecap="round"/>

    <!-- Smile -->
    <path d="M 188 235 Q 200 244, 212 235" fill="none" stroke="#965f3d" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Python Tech Badge in Bottom Right -->
  <g transform="translate(290, 290)">
    <circle cx="40" cy="40" r="34" fill="#0b192e" stroke="url(#accentGrad)" stroke-width="2.5" filter="url(#glow)"/>
    <!-- Python icon stylized -->
    <path d="M 39 22 C 30 22, 28 26, 28 30 L 28 34 L 40 34 L 40 36 L 24 36 C 20 36, 17 39, 17 44 C 17 50, 21 52, 25 52 L 28 52 L 28 48 C 28 44, 31 41, 35 41 L 45 41 C 48 41, 51 38, 51 35 L 51 28 C 51 24, 47 22, 39 22 Z M 35 27 C 36.5 27, 37.5 28, 37.5 29 C 37.5 30.5, 36.5 31.5, 35 31.5 C 33.5 31.5, 32.5 30.5, 32.5 29 C 32.5 28, 33.5 27, 35 27 Z" fill="#3b82f6"/>
    <path d="M 41 58 C 50 58, 52 54, 52 50 L 52 46 L 40 46 L 40 44 L 56 44 C 60 44, 63 41, 63 36 C 63 30, 59 28, 55 28 L 52 28 L 52 32 C 52 36, 49 39, 45 39 L 35 39 C 32 39, 29 42, 29 45 L 29 52 C 29 56, 33 58, 41 58 Z M 45 53 C 43.5 53, 42.5 52, 42.5 51 C 42.5 49.5, 43.5 48.5, 45 48.5 C 46.5 48.5, 47.5 49.5, 47.5 51 C 47.5 52, 46.5 53, 45 53 Z" fill="#fbbf24"/>
  </g>
</svg>